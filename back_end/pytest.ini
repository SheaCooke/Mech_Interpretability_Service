[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Don't recurse into the local virtual env or node_modules — those contain
# unrelated test files (e.g. mpmath/sympy) that would otherwise be collected.
norecursedirs = venv .venv front_end node_modules .git test
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
